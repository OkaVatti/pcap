name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CRYSTAL_CACHE_VERSION: v1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        crystal:
          - latest
          - 1.20.2
          - 1.19.2
          - 1.18.2
        include:
          - os: ubuntu-latest
            libpcap-pkg: libpcap-dev
          - os: macos-latest
            libpcap-pkg: libpcap

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install libpcap (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.libpcap-pkg }}

      - name: Install libpcap (macOS)
        if: runner.os == 'macOS'
        run: brew install ${{ matrix.libpcap-pkg }}

      - name: Show versions
        run: |
          crystal --version
          shards --version

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: ./lib
          key: shards-${{ runner.os }}-${{ matrix.crystal }}-${{ hashFiles('shard.lock') }}
          restore-keys: |
            shards-${{ runner.os }}-${{ matrix.crystal }}-
            shards-${{ runner.os }}-

      - name: Install shard dependencies
        run: shards install

      - name: Lint with Ameba
        run: |
          if shards list | grep -q ameba; then
            bin/ameba
          else
            echo "Ameba not installed; skipping lint."
          fi

      - name: Run tests (offline)
        run: crystal spec

      - name: Build (debug)
        run: crystal build src/libpcap.cr --error-trace

      - name: Build (release)
        run: crystal build src/libpcap.cr --release --error-trace

      - name: Build with optional flags (Linux only)
        if: runner.os == 'Linux'
        run: crystal build src/libpcap.cr -D remote -D protocol --error-trace

      - name: Generate API documentation
        run: crystal docs

      - name: Run live‑device tests (Linux only)
        if: runner.os == 'Linux'
        run: |
          # Set up a dummy network interface for live tests
          sudo modprobe dummy || true
          sudo ip link add dummy0 type dummy || true
          sudo ip link set dummy0 up || true

          # Run specs with live device tests enabled
          TEST_LIVE=1 crystal spec

          # Clean up
          sudo ip link delete dummy0 || true
